# No first-party client SDK is published to npm / PyPI / Maven / NuGet / RubyGems /
# Packagist / crates.io. Logik.io's public code artifacts are reference integrations /
# accelerators (Salesforce Apex, Adobe PHP), not installable client libraries — so no
# SDKs pointer is emitted. Cataloged here as official first-party packages/repos.
#
# CURRENCY: none of these is distributed through a package registry, so there is no
# registry metadata endpoint to read a version from. `registry: github` entries carry
# `version:` from a published GitHub release/tag where one exists (only logik-adobe
# has one) and `version: null` where the repo ships from a branch with no tag at all —
# a consumer cannot pin these, they can only clone a moving default branch.
# `published:` records the last push to the default branch (the only real date GitHub
# exposes for an untagged repo), and is labelled as such per entry.
