method: searched
source: https://api-docs.logik.io/ (Errors reference) + https://github.com/logikioopensource/api-docs/blob/main/source/includes/_errors.md
derived_from: openapi/logikio-runtime-v1-openapi-original.yml, openapi/logikio-runtime-v2-openapi-original.yml,
