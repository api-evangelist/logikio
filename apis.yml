image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/logikio.png
name: Logik.io
description: 'Logik.io is a headless, composable, API-first CPQ (Configure, Price, Quote) and
  product-configuration engine. It powers guided configuration, pricing, and quoting for complex
  products across Salesforce CPQ/Commerce and any headless front end, and computes Sales,
  Manufacturing, and Custom Bills of Materials. The platform exposes versioned Runtime APIs
  (start/update/save configurations, access Sets, retrieve BOMs) and Admin APIs (blueprints,
  fields, rules, managed data tables, jobs), authenticated with HTTP Bearer Runtime and Admin
  tokens. Logik.io was acquired by ServiceNow and is now also marketed as ServiceNow CPQ /
  Logik.ai; the developer surface at api-docs.logik.io and github.com/logikioopensource remains
  live and independent.'
